[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "async-dns-scanner"
version = "1.0.0"
description = "High-concurrency asynchronous RFC 1035 UDP DNS scanner and linguistic domain valuation engine."
readme = "README.md"
authors = [
    { name = "Daniel Sawa", email = "dns2jtm@icloud.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["dns", "asyncio", "networking", "domain-name", "whois", "high-performance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
]

[project.scripts]
dns-scanner = "dns_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dns_scanner*"]
